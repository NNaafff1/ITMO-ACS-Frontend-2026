<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск вакансий — Работа рядом</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- ДР2 (доступность): ссылка для пропуска навигации, видна только при фокусе с клавиатуры -->
  <a class="visually-hidden-focusable skip-link" href="#main-content">Перейти к основному содержимому</a>


  <header>
    <nav class="navbar navbar-expand-lg bg-white border-bottom" aria-label="Основная навигация">
      <div class="container">
        <a class="navbar-brand text-primary" href="index.html">Работа рядом</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" href="vacancies.html" aria-current="page">Вакансии</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Мой кабинет</a></li>
            <li class="nav-item"><a class="nav-link" href="employer.html">Работодателям</a></li>
          </ul>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="login.html">Войти</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content" tabindex="-1" class="py-4">
    <div class="container">
      <h1 class="h3 fw-bold mb-4">Поиск вакансий</h1>

      <div class="row g-4">

        <!-- Фильтры -->
        <aside class="col-lg-3" aria-label="Фильтры вакансий">
          <form id="filterForm" class="card filters-card" role="search" aria-label="Поиск и фильтры вакансий">
            <div class="card-body">
              <h2 class="h6 fw-bold mb-3">Фильтры</h2>

              <div class="mb-3">
                <label for="fSearch" class="form-label">Поиск по вакансиям</label>
                <input type="search" class="form-control" id="fSearch" placeholder="Например, верстальщик или Москва">
              </div>

              <div class="mb-3">
                <label for="fIndustry" class="form-label">Отрасль</label>
                <select class="form-select" id="fIndustry">
                  <option value="">Любая</option>
                  <option value="it">IT и разработка</option>
                  <option value="marketing">Маркетинг</option>
                  <option value="finance">Финансы</option>
                  <option value="education">Образование</option>
                  <option value="trade">Торговля</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="fSalary" class="form-label">Зарплата от, ₽</label>
                <input type="number" class="form-control" id="fSalary" min="0" step="5000" placeholder="0">
              </div>

              <div class="mb-4">
                <label for="fExperience" class="form-label">Опыт работы</label>
                <select class="form-select" id="fExperience">
                  <option value="">Любой</option>
                  <option value="none">Без опыта</option>
                  <option value="1-3">1–3 года</option>
                  <option value="3-6">3–6 лет</option>
                  <option value="6+">Более 6 лет</option>
                </select>
              </div>

              <button type="reset" class="btn btn-outline-secondary w-100" id="resetFilters">Сбросить фильтры</button>
            </div>
          </form>
        </aside>

        <!-- Результаты -->
        <section class="col-lg-9" aria-labelledby="resultsTitle">
          <!-- ЛР2: индикатор загрузки и сообщение об ошибке API -->
          <div class="alert alert-danger d-none" id="loadError" role="alert"></div>
          <div class="text-center py-4 d-none" id="loader" role="status">
            <div class="spinner-border text-primary" aria-hidden="true"></div>
            <span class="visually-hidden">Загрузка…</span>
          </div>
          <h2 class="h6 text-secondary mb-3" id="resultsTitle" aria-live="polite">
            Найдено вакансий: <span id="resultsCount">…</span>
          </h2>

          <!-- ЛР2: карточки создаются в js/vacancies.js из ответа API (в ЛР1 были написаны здесь) -->
          <div class="row g-3" id="vacancyList">
          </div>

          <div class="alert alert-secondary d-none mt-3" id="emptyMessage" role="status">
            Ничего не найдено. Измените условия поиска или сбросьте фильтры.
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer py-4">
    <div class="container text-secondary small">
      © <span id="current-year">2026</span> Работа рядом. Учебный проект, ИТМО.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/vacancies.js"></script>
</body>
</html>
